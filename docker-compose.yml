services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: promptscope
      POSTGRES_PASSWORD: promptscope
      POSTGRES_DB: promptscope
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptscope"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://promptscope:promptscope@postgres:5432/promptscope
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_HOST: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
